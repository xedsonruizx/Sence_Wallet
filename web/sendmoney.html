<div class="page-card mx-auto" style="max-width: 820px;">
  <div class="page-header d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center">
    <div>
      <h2>Enviar Dinero</h2>
      <p class="text-muted">Busca en tu agenda de transferencias o selecciona un contacto.</p>
    </div>
  </div>

  <div class="form-group">
    <label for="searchContact">Buscar en la agenda de transferencias</label>
    <input type="text" class="form-control" id="searchContact" placeholder="Buscar contacto">
  </div>
  <button type="button" id="add-contact-btn" class="btn btn-primary mb-4">Agregar nuevo contacto</button>

  <h3 class="mb-3">Contactos</h3>
  <ul id="contactList" class="list-group mb-4"></ul>

  <div class="form-group">
    <label for="transferAmount">Monto a enviar</label>
    <input type="number" class="form-control" id="transferAmount" min="1" step="0.01" placeholder="Ingresa el monto">
  </div>

  <div class="d-flex flex-wrap align-items-center page-actions">
    <button type="button" id="send-money-btn" class="btn btn-primary">Enviar dinero</button>
    <a href="master.html?page=menu" class="btn btn-secondary">Volver al Menú Principal</a>
  </div>

  <p id="send-message" class="form-feedback" aria-live="polite" hidden></p>
</div>

<div class="modal fade" id="addContactModal" tabindex="-1" role="dialog" aria-labelledby="addContactModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addContactModalLabel">Agregar nuevo contacto</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="add-contact-form" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="contactName">Nombre y apellido</label>
            <input type="text" class="form-control" id="contactName" placeholder="Ej: Juan Pérez">
          </div>
          <div class="form-group">
            <label for="contactCbu">Número de CBU</label>
            <input type="text" class="form-control" id="contactCbu" placeholder="Ej: 1234567890123456789012" inputmode="numeric">
          </div>
          <div class="form-group">
            <label for="contactAlias">Alias</label>
            <input type="text" class="form-control" id="contactAlias" placeholder="Ej: juan.perez">
          </div>
          <div class="form-group mb-0">
            <label for="contactBank">Nombre del Banco</label>
            <input type="text" class="form-control" id="contactBank" placeholder="Ej: Banco Estado">
          </div>
          <p id="contact-modal-message" class="form-feedback mt-3 mb-0" aria-live="polite" hidden></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar contacto</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../js/page-redirect.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/wallet.js"></script>
<script src="../js/sendmoney.js"></script>
<noscript>
    <p class="text-muted">Usa <a href="layout/master.html?page=sendmoney">master.html?page=sendmoney</a> para ver esta página correctamente.</p>
</noscript>
