<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 160px);">
  <div class="page-card w-100" style="max-width: 420px;">
    <div class="text-center mb-4">
      <h2>Inicio de sesión</h2>
      <p class="text-muted">Accede a tu cuenta para ver tu saldo y movimientos.</p>
    </div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" class="form-control" id="username" placeholder="Ingresa tu usuario 'admin'" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña 'admin'" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      <p id="login-message" class="form-feedback" aria-live="polite" hidden></p>
    </form>
  </div>
</div>

<script src="../js/page-redirect.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/login.js"></script>
<noscript>
    <p class="text-muted">Usa <a href="layout/master.html?page=login">master.html?page=login</a> para ver esta página correctamente.</p>
</noscript>
